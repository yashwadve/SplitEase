{% extends "base.html" %}
{% block title %}Delete {{ group.name }} — SplitEase{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card-ticket auth-card text-center">
    <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
    <h3 class="mt-3 mb-2">Delete "{{ group.name }}"?</h3>
    <p class="text-muted">
      This permanently deletes the group, its member list, and all its expenses. This can't be undone.
    </p>
    <form method="post" class="d-flex gap-2 justify-content-center mt-3">
      {% csrf_token %}
      <a href="{% url 'groups:group_detail' pk=group.pk %}" class="btn btn-outline-secondary">Cancel</a>
      <button type="submit" class="btn btn-danger">Yes, delete group</button>
    </form>
  </div>
</div>
{% endblock %}
