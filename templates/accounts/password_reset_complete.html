{% extends "base.html" %}
{% block title %}Password reset — SplitEase{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card-ticket auth-card text-center">
    <i class="bi bi-check-circle fs-1" style="color: var(--se-owed);"></i>
    <h3 class="mt-3 mb-2">Password reset complete</h3>
    <p class="text-muted">You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Log in</a>
  </div>
</div>
{% endblock %}
